<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2545E6">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>YDS Kelime Defteri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Zilla+Slab:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column. Multiple-choice options are optical answer-sheet bubbles (A-E, as on the real YDS form); the English word carries a highlighter band; everything else stays quiet. */
:root{
  --paper:#F2F3EF; --card:#FFFFFF; --ink:#16202D; --ink2:#566174; --line:#D8DCD4; --soft:#E8EBE4;
  --accent:#2545E6; --accent-ink:#FFFFFF; --accent-soft:#E3E8FD; --accent-mid:#8EA0F0;
  --mark:#FFE35A; --good:#177A49; --good-soft:#DDF3E7; --bad:#BE3A3A; --bad-soft:#FBE3E1;
  --graphite:#2A2F39; --on-graphite:#F2F3EF;
  --f-disp:'Zilla Slab',Georgia,'Times New Roman',serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10131A; --card:#181D27; --ink:#E7EAF1; --ink2:#9AA5B8; --line:#2B3343; --soft:#212836;
    --accent:#8CA2FF; --accent-ink:#0D1230; --accent-soft:#222A4D; --accent-mid:#4A5BB0;
    --mark:#8A7A12; --good:#4CC38A; --good-soft:#143427; --bad:#F27D7D; --bad-soft:#3B1D21;
    --graphite:#C9CFDB; --on-graphite:#10131A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10131A; --card:#181D27; --ink:#E7EAF1; --ink2:#9AA5B8; --line:#2B3343; --soft:#212836;
  --accent:#8CA2FF; --accent-ink:#0D1230; --accent-soft:#222A4D; --accent-mid:#4A5BB0;
  --mark:#8A7A12; --good:#4CC38A; --good-soft:#143427; --bad:#F27D7D; --bad-soft:#3B1D21;
  --graphite:#C9CFDB; --on-graphite:#10131A; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:0;padding-bottom:96px}
body.insess{padding-bottom:32px}
.wrap{max-width:640px;margin:0 auto;min-width:0}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--ink2)}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}

/* top header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px}
.top h1{font-size:1.35rem;font-weight:700}
.pill{font-size:.78rem;border:1px solid var(--line);background:var(--card);padding:3px 9px;border-radius:6px;white-space:nowrap}

/* highlighter */
.hl{background:linear-gradient(transparent 60%,var(--mark) 60%,var(--mark) 94%,transparent 94%);padding:0 .1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* cards & buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px;padding-block:8px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions>.btn{flex:1 1 140px}
.ico{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;min-height:38px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.coach{color:var(--ink2);font-size:.92rem}
.sec-h{font-size:1.1rem;margin-bottom:8px}

/* Today */
.hero{padding-block:8px 4px;display:flex;flex-direction:column;gap:10px}
.hero h2{font-size:clamp(1.7rem,7vw,2.2rem);font-weight:700}
.lead{color:var(--ink2)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.steps3 div{border-top:3px solid var(--ink);padding-top:8px;font-size:.88rem}
.steps3 b{display:block;font-family:var(--f-disp);font-size:1rem}
.wchips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.wchips span{font-family:var(--f-disp);font-weight:500}
details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center}

/* flashcard */
.flash{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:22px 18px}
.big{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.9rem,9vw,2.7rem);line-height:1.15;overflow-wrap:anywhere}
.mean{font-size:1.2rem}

/* session */
.stbar{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.stmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.stlab{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--ink2)}
.q{display:flex;flex-direction:column;gap:8px;padding:12px 2px 14px}
.qlab{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.qprompt{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.6rem,7.5vw,2.2rem);line-height:1.2;overflow-wrap:anywhere}
.q .ico{align-self:flex-start}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:10px 14px;border:1px solid var(--line);background:var(--card);border-radius:8px}
.opt .otxt{min-width:0;overflow-wrap:anywhere}
.bub{flex:0 0 32px;height:32px;border:2px solid var(--ink2);border-radius:50%;display:grid;place-items:center;font:500 .85rem var(--f-mono);color:var(--ink2)}
.opt:not(:disabled):hover .bub{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{color:inherit;opacity:1}
.fb{min-height:24px;margin-top:12px}
.fb .good{color:var(--good);font-weight:600}
.fb .bad{background:var(--bad-soft);border:1px solid var(--bad);border-radius:8px;padding:10px 12px}
.slots{font-size:1.15rem;letter-spacing:.14em;color:var(--ink2);overflow-wrap:anywhere}
input[type=text],input[type=search]{width:100%;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:500 1.15rem var(--f-mono)}
input.shake,.tile.bad,.opt.no{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.row2{display:flex;gap:8px;flex-wrap:wrap}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{min-height:60px;padding:8px 10px;border:1px solid var(--line);background:var(--card);border-radius:8px;text-align:left;overflow-wrap:anywhere;font-size:.95rem;line-height:1.3}
.tile.en{font-family:var(--f-disp);font-weight:700;font-size:1.05rem}
.tile.sel{border:2px solid var(--accent);background:var(--accent-soft)}
.tile.done{border-color:var(--good);background:var(--good-soft);color:var(--ink);pointer-events:none;opacity:.75}
.tile.bad{border-color:var(--bad);background:var(--bad-soft)}

/* games */
.gcard{display:flex;flex-direction:column;gap:8px}
.gcard h3{font-size:1.2rem}
.gbar{display:flex;align-items:center;gap:12px;padding-block:14px 8px}
.gbar .bar{flex:1}
.letters{display:flex;flex-wrap:wrap;gap:8px}
.lt{width:48px;height:52px;border:1px solid var(--line);background:var(--card);border-radius:8px;font:500 1.25rem var(--f-mono);text-transform:lowercase}
.lt:disabled{opacity:.25}
.ans{display:flex;flex-wrap:wrap;gap:6px;min-height:56px;padding-block:6px}
.ans span{width:40px;height:48px;border-bottom:3px solid var(--ink);display:grid;place-items:center;font:500 1.3rem var(--f-mono);text-transform:lowercase}
.ans.okk span{border-color:var(--good);color:var(--good)}
.ans.badd span{border-color:var(--bad);color:var(--bad)}

/* list */
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row b{font-family:var(--f-disp);font-size:1.08rem;overflow-wrap:anywhere}
.row .tr{color:var(--ink2);font-size:.92rem;overflow-wrap:anywhere}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2)}
.dot.s1{background:var(--accent-mid);border-color:var(--accent-mid)}
.dot.s2{background:var(--accent);border-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink2);align-items:center}
.legend .dot{display:inline-block;vertical-align:-2px;margin-right:5px;width:10px;height:10px}

/* plan */
.day{border-bottom:1px solid var(--line)}
.day summary{justify-content:space-between;gap:10px}
.day .dn{font-family:var(--f-disp);font-weight:700}
.day .st{font-size:.8rem}
.day.now summary .dn{box-shadow:inset 0 -.45em var(--mark)}
.dbody{padding:2px 0 12px;display:flex;flex-direction:column;gap:2px;font-size:.93rem}
.dbody div{display:flex;gap:8px;justify-content:space-between}
.dbody span:first-child{font-family:var(--f-disp);font-weight:500}
.dbody span:last-child{color:var(--ink2);text-align:right}

/* stats */
.cbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft)}
.cbar i{display:block;height:100%}
.cbar .m{background:var(--accent)}.cbar .l{background:var(--accent-mid)}
.crow{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:6px;font-size:.92rem}
.fc{display:flex;gap:8px;align-items:flex-end;height:110px}
.fc div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.fc i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.fc span{font-size:.75rem;color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{border-top:3px solid var(--ink);padding-top:6px}
.kv b{display:block;font-family:var(--f-disp);font-size:1.6rem;line-height:1.1}
.kv span{font-size:.8rem;color:var(--ink2)}
.sp{display:flex;flex-direction:column;gap:10px}

/* bottom tabs */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));z-index:5}
body.insess .nav{display:none}
.tabs{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;color:var(--ink2);text-decoration:none;font-size:.78rem;font-weight:500;border-radius:8px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:inset 0 3px var(--accent)}

/* confirm dialog */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.55);display:grid;place-items:center;padding:20px;z-index:20}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:360px;width:100%}
.scrim[hidden]{display:none!important}
.note{font-size:.88rem;color:var(--ink2)}
.warn{background:var(--bad-soft);border:1px solid var(--bad);border-radius:8px;padding:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  var b=S.w[id][0],it=DATA[id],r=Math.random();
  if(b<=2)return r<.5?'e2t':'t2e';
  if(b<=4)return (it.nt||r<.5)?'t2e':'type';
  return it.nt?'t2e':'type';
}

/* ---------- lesson & review flow ---------- */
function startLesson(){
  var ids=[];for(var i=S.ptr;i<Math.min(N,S.ptr+S.pace);i++)ids.push(i);
  if(!ids.length)return;
  var due=dueList().slice(0,40);
  sess={kind:'lesson',steps:[],i:-1,stats:{ok:0,tot:0,newN:ids.length,rev:0}};
  if(due.length)sess.steps.push(function(){runReview(due,'Tekrar')});
  sess.steps.push(function(){stepMeet(ids)},function(){stepMatch(ids)},function(){stepMC(ids)},function(){stepType(ids)},function(){stepSay(ids)},function(){stepFinish()});
  document.body.classList.add('insess');window.scrollTo(0,0);
  nextStep();
}
function startReview(){
  var due=dueList().slice(0,40);if(!due.length)return;
  sess={kind:'review',steps:[],i:-1,stats:{ok:0,tot:0,newN:0,rev:due.length}};
  sess.steps.push(function(){runReview(due,'Tekrar')},function(){stepFinish()});
  document.body.classList.add('insess');window.scrollTo(0,0);
  nextStep();
}
function runReview(list,title){
  var items=shuffle(list.map(function(id){return {id:id,kind:kindFor(id)}}));
  sess.stats.rev=list.length;
  runQuiz({title:title,items:items,
    onFirst:function(it,ok){srsResult(it.id,ok);sess.stats.tot++;if(ok)sess.stats.ok++},
    after:function(){touchStreak();commit();nextStep()}});
}

/* step: meet */
function stepMeet(ids){
  var k=0;
  function draw(){
    var it=DATA[ids[k]];
    stage(sessTop('Tanış',k+1,ids.length)+
      '<div class="card flash"><span class="tag">'+CATN[it.c]+'</span><div class="big"><span class="hl">'+esc(it.en)+'</span></div><p class="mean">'+esc(it.tr)+'</p>'+
      (TTS?'<button class="btn ghost sm" data-act="say" data-id="'+it.id+'">'+ICON.spk+' Dinle</button>':'')+
      '<p class="coach">Kelimeyi duy, sonra yüksek sesle iki kez tekrar et. Anlamını da söyle.</p></div>'+
      '<div class="actions"><button class="btn ghost" data-act="prev"'+(k?'':' disabled')+'>Geri</button><button class="btn" data-act="next">'+(k===ids.length-1?'Tanışma bitti':'Sonraki')+'</button></div>');
    if(S.snd)speak(sayText(it));
  }
  cur={click:function(a){
    if(a==='prev'&&k>0){k--;draw()}
    else if(a==='next'){
      if(k<ids.length-1){k++;draw();window.scrollTo(0,0)}
      else{
        if(!S.w[ids[0]])introduce(ids);
        nextStep();
      }
    }
  }};
  draw();
}

/* match engine (used by lesson step and game) */
function runMatch(groups,label,done,quiet){
  var round=0,sel=null,matched=0,miss=0,t0=Date.now(),lock=false;
  function draw(){
    var g=groups[round],L=shuffle(g),R=shuffle(g);matched=0;sel=null;lock=false;
    stage(sessTop(label,round+1,groups.length)+
      '<p class="coach" style="margin-bottom:10px">Bir İngilizce kelimeye, sonra anlamına dokun.</p><div class="mgrid"><div class="mcol">'+
      L.map(function(id){return '<button class="tile en" data-act="m" data-s="e" data-id="'+id+'">'+esc(DATA[id].en)+'</button>'}).join('')+
      '</div><div class="mcol">'+
      R.map(function(id){return '<button class="tile" data-act="m" data-s="t" data-id="'+id+'">'+esc(DATA[id].tr)+'</button>'}).join('')+'</div></div>');
  }
  cur={click:function(a,el){
    if(a==='cont'){done({miss:miss,sec:Math.round((Date.now()-t0)/1000)});return}
    if(a!=='m'||lock||el.classList.contains('done'))return;
    if(!sel){sel=el;el.classList.add('sel');return}
    if(sel===el){el.classList.remove('sel');sel=null;return}
    if(sel.dataset.s===el.dataset.s){sel.classList.remove('sel');sel=el;el.classList.add('sel');return}
    var a1=sel,b1=el;sel=null;
    if(a1.dataset.id===b1.dataset.id){
      a1.classList.remove('sel');a1.classList.add('done');b1.classList.add('done');matched++;
      if(matched===groups[round].length){
        lock=true;
        if(round<groups.length-1){later(function(){round++;draw()},550)}
        else if(quiet){later(function(){done({miss:miss,sec:Math.round((Date.now()-t0)/1000)})},450)}
        else{later(function(){
          stage('<div class="stack" style="padding-top:24px"><div class="card"><h3 class="sec-h">Eşleştirme bitti</h3><p>'+miss+' hata · '+Math.round((Date.now()-t0)/1000)+' saniye</p><div class="actions"><button class="btn" data-act="cont">Devam</button></div></div></div>');
        },550)}
      }
    }else{
      miss++;lock=true;a1.classList.remove('sel');a1.classList.add('bad');b1.classList.add('bad');
      later(function(){a1.classList.remove('bad');b1.classList.remove('bad');lock=false},450);
    }
  }};
  draw();
}
function stepMatch(ids){
  runMatch(chunk(shuffle(ids),6),'Eşleştir',function(){nextStep()});
}

/* quiz engine */
function runQuiz(cfg){
  var Q=cfg.items.slice(),k=0,total=Q.length,answered=false,copyMode=false,hintLv=0,t=null,it=null,opts=null,correctIdx=0;
  var letters='ABCDE';
  function draw(){
    if(k>=Q.length){if(cfg.after)cfg.after();return}
    t=Q[k];it=DATA[t.id];answered=false;copyMode=false;hintLv=0;t.hinted=false;
    if(t.kind==='type')drawType();else drawMC();
  }
  function advance(){k++;draw();window.scrollTo(0,0)}
  function shownIdx(){return Math.min(k+1,total)}
  function first(ok){
    if(t.retry)return;
    if(cfg.onFirst)cfg.onFirst(it,ok,t.kind);
    if(!ok)Q.push({id:t.id,kind:t.kind==='type'?'type':t.kind,retry:1});
  }
  function drawMC(){
    var e2t=t.kind==='e2t';
    opts=makeOpts(it,e2t?'tr':'en');
    correctIdx=opts.indexOf(it);
    stage(sessTop(cfg.title,shownIdx(),total)+
      '<div class="q"><p class="qlab">'+(e2t?'Türkçe anlamı hangisi?':'İngilizcesi hangisi?')+'</p><div class="qprompt">'+(e2t?'<span class="hl">'+esc(it.en)+'</span>':esc(it.tr))+'</div>'+
      (e2t&&TTS?'<button class="ico" data-act="say" data-id="'+it.id+'" aria-label="Dinle">'+ICON.spk+'</button>':'')+'</div>'+
      '<div class="opts">'+opts.map(function(o,i){return '<button class="opt" data-act="pick" data-i="'+i+'"><span class="bub">'+letters[i]+'</span><span class="otxt">'+esc(e2t?o.tr:o.en)+'</span></button>'}).join('')+'</div><div class="fb" id="fb"></div>');
  }
  function pick(i){
    if(answered)return;answered=true;
    var ok=(i===correctIdx),els=$$('.opt');
    els.forEach(function(b){b.disabled=true});
    els[i].classList.add(ok?'ok':'no');
    if(!ok)els[correctIdx].classList.add('ok');
    first(ok);
    var fb=$('#fb');
    if(ok){fb.innerHTML='<span class="good">Doğru</span>';later(advance,650)}
    else{fb.innerHTML='<div class="bad"><span class="hl">'+esc(it.en)+'</span> = '+esc(it.tr)+'</div><div class="actions"><button class="btn" data-act="cont">Devam</button></div>'}
  }
  function drawType(){
    stage(sessTop(cfg.title,shownIdx(),total)+
      '<div class="q"><p class="qlab">'+(variants(it).length>1?'Bu anlama gelen ifadelerden birini yaz':'İngilizcesini yaz')+'</p><div class="qprompt">'+esc(it.tr)+'</div><p class="slots mono" id="slots">'+esc(slotText(it,0))+'</p></div>'+
      '<form id="tf" autocomplete="off"><input id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="İngilizce karşılığı yaz">'+
      '<div class="actions"><button type="button" class="btn ghost sm" data-act="hint">İpucu</button><button type="button" class="btn ghost sm" data-act="idk">Bilmiyorum</button><button type="submit" class="btn">Kontrol et</button></div></form><div class="fb" id="fb"></div>');
    var inp=$('#ans');if(inp)inp.focus();
  }
  function wrongType(){
    answered=true;copyMode=true;first(false);
    var fb=$('#fb');
    fb.innerHTML='<div class="bad">Doğrusu: <span class="hl">'+esc(variants(it).join(' / '))+'</span></div><p class="coach" style="margin-top:8px">Doğrusunu yazarak devam et.</p>';
    var inp=$('#ans');inp.value='';inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');inp.focus();
  }
  cur={
    click:function(a,el){
      if(a==='pick')pick(+el.dataset.i);
      else if(a==='cont')advance();
      else if(a==='hint'){if(answered)return;hintLv=Math.min(3,hintLv+1);t.hinted=true;$('#slots').textContent=slotText(it,hintLv);$('#ans').focus()}
      else if(a==='idk'){if(!answered)wrongType()}
    },
    submit:function(){
      var inp=$('#ans');if(!inp)return;
      var ok=checkTyped(it,inp.value);
      if(copyMode){
        if(ok){later(advance,150);$('#fb').innerHTML='<span class="good">Tamam</span>'}
        else{inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake')}
        return;
      }
      if(answered)return;
      if(ok&&!t.hinted){
        answered=true;first(true);inp.disabled=true;
        $('#fb').innerHTML='<span class="good">Doğru</span>';later(advance,650);
      }else if(ok&&t.hinted){
        answered=true;first(false);inp.disabled=true;
        $('#fb').innerHTML='<span class="good">Doğru, ama ipucuyla. Bir kez daha sorulacak.</span><div class="actions"><button class="btn" data-act="cont">Devam</button></div>';
      }else{wrongType()}
    },
    key:function(e){
      if(!t)return;
      var tag=(document.activeElement&&document.activeElement.tagName)||'';
      if(t.kind!=='type'){
        if(!answered){
          var m={a:0,b:1,c:2,d:3,e:4,'1':0,'2':1,'3':2,'4':3,'5':4}[e.key.toLowerCase()];
          if(m!==undefined&&m<opts.length&&!e.ctrlKey&&!e.metaKey){pick(m)}
        }else if(e.key==='Enter'){var c=$('[data-act="cont"]');if(c)advance()}
      }else if(e.key==='Enter'&&answered&&!copyMode&&tag!=='INPUT'){var c2=$('[data-act="cont"]');if(c2)advance()}
    }
  };
  draw();
}
function stepMC(ids){
  var items=shuffle(ids).map(function(id){return {id:id,kind:'e2t'}}).concat(shuffle(ids).map(function(id){return {id:id,kind:'t2e'}}));
  runQuiz({title:'Çoktan seçmeli',items:items,
    onFirst:function(it,ok){sess.stats.tot++;if(ok)sess.stats.ok++;else bumpWrong(it.id)},
    after:function(){commit();nextStep()}});
}
function stepType(ids){
  var list=shuffle(ids.filter(function(id){return !DATA[id].nt}));
  if(!list.length){nextStep();return}
  runQuiz({title:'Yazma',items:list.map(function(id){return {id:id,kind:'type'}}),
    onFirst:function(it,ok){sess.stats.tot++;if(ok)sess.stats.ok++;else bumpWrong(it.id)},
    after:function(){commit();nextStep()}});
}

/* step: say it aloud, then check */
function stepSay(ids){
  var Q=shuffle(ids).slice(),k=0,total=Q.length,revealed=false,retried={};
  function draw(){
    if(k>=Q.length){commit();nextStep();return}
    var it=DATA[Q[k]];revealed=false;
    stage(sessTop('Sesli tekrar',Math.min(k+1,total),total)+
      '<div class="card flash"><span class="tag">'+CATN[it.c]+'</span><p class="qlab">İngilizcesini yüksek sesle söyle</p><div class="big">'+esc(it.tr)+'</div>'+
      '<div id="rv"><button class="btn wide" data-act="show">Cevabı göster</button></div></div>');
  }
  cur={click:function(a){
    var id=Q[k],it=DATA[id];
    if(a==='show'&&!revealed){
      revealed=true;
      $('#rv').innerHTML='<div class="big" style="margin-bottom:10px"><span class="hl">'+esc(it.en)+'</span></div>'+
        (TTS?'<button class="btn ghost sm" data-act="say" data-id="'+it.id+'">'+ICON.spk+' Dinle</button>':'')+
        '<p class="coach" style="margin-block:10px">Doğru söyledin mi? Dürüst işaretle, tekrar zamanlaması buna göre ayarlanır.</p>'+
        '<div class="actions"><button class="btn ghost" data-act="no">Hatırlamadım</button><button class="btn" data-act="yes">Doğru söyledim</button></div>';
      if(S.snd)speak(sayText(it));
    }else if(a==='yes'&&revealed){k++;draw()}
    else if(a==='no'&&revealed){
      bumpWrong(id);
      if(!retried[id]){retried[id]=1;Q.push(id)}
      k++;draw();
    }
  }};
  draw();
}
function stepFinish(){
  var st=sess.stats,T=today();
  var tomorrow=Object.keys(S.w).filter(function(id){return S.w[id][1]<=T+1}).length;
  var acc=st.tot?Math.round(st.ok/st.tot*100):null;
  commit();
  stage('<div class="stack" style="padding-top:28px"><p class="eyebrow">'+(sess.kind==='lesson'?'Ders bitti':'Tekrar bitti')+'</p><h2 style="font-size:2rem">Güzel iş.</h2>'+
    '<div class="card"><div class="kv">'+
    (st.newN?'<div><b>'+st.newN+'</b><span>yeni kelime</span></div>':'')+
    (st.rev?'<div><b>'+st.rev+'</b><span>tekrar</span></div>':'')+
    (acc!==null?'<div><b>%'+acc+'</b><span>ilk denemede doğru</span></div>':'')+
    '</div></div>'+
    '<div class="card"><p>Yarın <b>'+tomorrow+'</b> kelime tekrar için gelecek. Bu kelimeleri yarın aç, çünkü aralıklı tekrarın işe yaraması buna bağlı.</p></div>'+
    '<div class="actions"><button class="btn wide" data-act="end">Bitir</button></div></div>');
  cur={click:function(a){if(a==='end')endSession()}};
}

/* ---------- GAMES ---------- */
function gamePool(){
  var ids=[];
  for(var i=0;i<N;i++){
    if(gsrc.src==='learned'&&!S.w[i])continue;
    if(gsrc.cat!=='all'&&DATA[i].c!==gsrc.cat)continue;
    ids.push(i);
  }
  return ids;
}
function vGames(){
  var learned=Object.keys(S.w).length;
  if(gsrc.src==='learned'&&learned<8)gsrc.src='all';
  var pool=gamePool();
  cur.click=function(a,el){
    if(a==='gs'){gsrc.src=el.dataset.v;render()}
    else if(a==='gc'){gsrc.cat=el.dataset.v;render()}
    else if(a==='g'){startGame(el.dataset.k)}
  };

function gameSpeed(pool){
  var bag=shuffle(pool),bi=0,score=0,left=60,over=false,lock=false,wrong=[],it=null,opts=null,cidx=0,e2t=true,iv=null,letters='ABCDE';
  function bar(){
    var g=$('#gt'),l=$('#gl'),s=$('#gs');
    if(g)g.style.width=Math.max(0,left/60*100)+'%';if(l)l.textContent=Math.max(0,Math.ceil(left));if(s)s.textContent=score;
  }
  function q(){
    if(over)return;
    it=DATA[bag[bi++%bag.length]];e2t=Math.random()<.5;lock=false;
    opts=makeOpts(it,e2t?'tr':'en');cidx=opts.indexOf(it);
    stage('<div class="gbar"><button class="ico" data-act="quit" aria-label="Çık">'+ICON.x+'</button><span class="mono" id="gs">'+score+'</span><div class="bar"><i id="gt" style="width:'+Math.max(0,left/60*100)+'%"></i></div><span class="mono" id="gl">'+Math.max(0,Math.ceil(left))+'</span></div>'+
      '<div class="q"><p class="qlab">'+(e2t?'Türkçesi?':'İngilizcesi?')+'</p><div class="qprompt">'+(e2t?'<span class="hl">'+esc(it.en)+'</span>':esc(it.tr))+'</div></div>'+
      '<div class="opts">'+opts.map(function(o,i){return '<button class="opt" data-act="pick" data-i="'+i+'"><span class="bub">'+letters[i]+'</span><span class="otxt">'+esc(e2t?o.tr:o.en)+'</span></button>'}).join('')+'</div>');
  }
  function finish(){
    over=true;clearInterval(iv);
    var best=score>S.hs;if(best){S.hs=score;commit()}
    gameEnd('<p class="eyebrow">Süre doldu</p><h2 style="font-size:2.4rem">'+score+' doğru</h2>'+(best?'<p class="good" style="color:var(--good);font-weight:600">Yeni rekor.</p>':'')+
      (wrong.length?'<div class="card"><h3 class="sec-h">Takıldıkların</h3>'+wrong.slice(0,10).map(function(w){return '<div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0"><b style="font-family:var(--f-disp)">'+esc(w.en)+'</b><span class="dim" style="text-align:right">'+esc(w.tr)+'</span></div>'}).join('')+'</div>':''));
  }
  function pick(i){
    if(lock||over)return;lock=true;
    var els=$$('.opt'),ok=i===cidx;els.forEach(function(b){b.disabled=true});
    els[i].classList.add(ok?'ok':'no');if(!ok)els[cidx].classList.add('ok');
    if(ok){score++;bar();later(q,260)}else{left-=3;wrong.push(it);bar();later(q,800)}
  }
  sess.cleanup=function(){clearInterval(iv)};
  cur={click:function(a,el){
    if(a==='pick')pick(+el.dataset.i);
    else if(a==='again'){clearInterval(iv);clearTimers();startGame('speed')}
    else if(a==='end')endSession();
  },key:function(e){
    if(over||lock)return;var m={a:0,b:1,c:2,d:3,e:4,'1':0,'2':1,'3':2,'4':3,'5':4}[e.key.toLowerCase()];
    if(m!==undefined&&m<opts.length)pick(m);
  }};
  iv=setInterval(function(){
    if(over)return;left-=0.1;bar();if(left<=0){left=0;bar();finish()}
  },100);
  q();
}
function gameMatch(pool){
  var ids=shuffle(pool).slice(0,18);
  var groups=chunk(ids,6);
  runMatch(groups,'Eşleştirme',function(r){
    gameEnd('<p class="eyebrow">Eşleştirme bitti</p><h2 style="font-size:2.2rem">'+r.sec+' saniye</h2><p class="lead">'+r.miss+' hata</p>');
    cur={click:function(a){
      if(a==='again'){clearTimers();startGame('match')}else if(a==='end')endSession();
    }};
  },true);
}
function gameScramble(pool){
  var cand=pool.filter(function(id){var it=DATA[id];return !it.nt&&/^[A-Za-z]{4,12}$/.test(main(it))});
  if(cand.length<6){cand=[];for(var i=0;i<N;i++){var x=DATA[i];if(!x.nt&&/^[A-Za-z]{4,12}$/.test(main(x)))cand.push(i)}}
  var rounds=shuffle(cand).slice(0,10),r=0,score=0,hints=0,word='',tiles=[],used=[],built=[],locked=false;
  function scr(w){var a=w.split(''),s;var tries=0;do{s=shuffle(a);tries++}while(s.join('')===w&&tries<10);return s}
  function draw(){
    if(r>=rounds.length){
      gameEnd('<p class="eyebrow">Harf sırala bitti</p><h2 style="font-size:2.4rem">'+score+' / '+rounds.length+'</h2><p class="lead">'+hints+' ipucu kullandın.</p>');return;
    }
    var it=DATA[rounds[r]];word=main(it).toLowerCase();tiles=scr(word);used=tiles.map(function(){return false});built=[];locked=false;
    stage(sessTop('Harf sırala',r+1,rounds.length)+
      '<div class="q"><p class="qlab">Anlamı</p><div class="qprompt">'+esc(it.tr)+'</div></div><div class="ans" id="ans"></div><div class="letters" id="lt"></div>'+
      '<div class="actions"><button class="btn ghost sm" data-act="del">Sil</button><button class="btn ghost sm" data-act="hint">İpucu</button><button class="btn ghost sm" data-act="skip">Geç</button></div><div class="fb" id="fb"></div>');
    paint();
  }
  function paint(){
    var a=$('#ans');if(!a)return;
    var s='';for(var i=0;i<word.length;i++)s+='<span>'+(built[i]!==undefined?esc(tiles[built[i]]):'')+'</span>';
    a.innerHTML=s;
    $('#lt').innerHTML=tiles.map(function(ch,i){return '<button class="lt" data-act="t" data-i="'+i+'"'+(used[i]?' disabled':'')+'>'+esc(ch)+'</button>'}).join('');
  }
  function check(){
    var guess=built.map(function(i){return tiles[i]}).join('');
    var a=$('#ans');
    if(guess===word){
      locked=true;score++;a.classList.add('okk');$('#fb').innerHTML='<span class="good">Doğru</span>';
      later(function(){r++;draw()},800);
    }else{
      locked=true;a.classList.add('badd');
      later(function(){built=[];used=tiles.map(function(){return false});locked=false;paint();var aa=$('#ans');if(aa)aa.classList.remove('badd')},600);
    }
  }
  cur={click:function(a,el){
    if(a==='again'){clearTimers();startGame('scramble');return}
    if(a==='end'){endSession();return}
    if(locked)return;
    if(a==='t'){
      var i=+el.dataset.i;if(used[i]||built.length>=word.length)return;
      used[i]=true;built.push(i);paint();if(built.length===word.length)check();
    }else if(a==='del'){
      if(built.length){used[built.pop()]=false;paint()}
    }else if(a==='hint'){
      /* rebuild the correct prefix, then add the next letter */
      var ok=0;for(var j=0;j<built.length;j++){if(tiles[built[j]]===word[j])ok++;else break}
      while(built.length>ok){used[built.pop()]=false}
      var need=word[built.length],found=-1;
      for(var k=0;k<tiles.length;k++){if(!used[k]&&tiles[k]===need){found=k;break}}
      if(found>=0){used[found]=true;built.push(found);hints++;paint();if(built.length===word.length)check()}
    }else if(a==='skip'){
      locked=true;$('#fb').innerHTML='<div class="bad">Doğrusu: <span class="hl">'+esc(word)+'</span></div>';later(function(){r++;draw()},1400);
    }
  }};
  draw();
}

    '<div id="rsb" class="warn" hidden><p>Tüm ilerleme, seri ve tekrar takvimi silinecek. Bu geri alınamaz.</p><div class="actions"><button class="btn ghost" data-act="rsno">Vazgeç</button><button class="btn" data-act="rsyes">Evet, sıfırla</button></div></div></div></div>';
  return h;
}


function bkNote(m){var el=document.getElementById('bknote');if(el)el.textContent=m}
function exportProgress(){
  var name='yds-ilerleme-'+new Date().toISOString().slice(0,10)+'.json',data=JSON.stringify(S);
  function viaLink(){
    try{var b=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);bkNote('Yedek dosyası indirildi.')}catch(e){bkNote('Yedek alınamadı.')}
  }
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(d){
      if(!d){viaLink();return}
      d.save({filename:name,data:data}).then(function(){bkNote('Yedek dosyası kaydedildi.')},function(){bkNote('Kaydetme iptal edildi.')});
    },viaLink);
  }else viaLink();
}
document.addEventListener('change',function(e){
  if(!e.target||e.target.id!=='impf')return;
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var o=JSON.parse(r.result);if(!o||typeof o!=='object'||!o.w||!o.st)throw 0;S=Object.assign(fresh(),o);commit();render();setTimeout(function(){bkNote('Yedek yüklendi.')},0)}
    catch(x){bkNote('Bu dosya geçerli bir YDS yedeği değil.')}
  };
  r.readAsText(f);
});
/* ---------- boot ---------- */
setView();
render();
initSync();
})();
</script>
